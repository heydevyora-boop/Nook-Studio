# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: push this repo to GitHub, then "New +" -> "Blueprint" in the Render
# dashboard and point it at this file (root dir: server/ if monorepo).
services:
  - type: web
    name: nookk-studio-api
    runtime: node
    plan: starter
    region: oregon
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nookk-studio-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: STUDIO_NOTIFICATION_EMAIL
        sync: false
      # Google Sheets inquiry mirror — values are entered in the Render
      # dashboard (never committed). Leave unset to disable the integration.
      - key: GOOGLE_SHEETS_SPREADSHEET_ID
        sync: false
      - key: GOOGLE_SHEETS_SHEET_NAME
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false

databases:
  - name: nookk-studio-db
    plan: starter
    region: oregon
